{% extends 'store/base.html' %}{% block title %}إتمام الطلب{% endblock %}
{% block content %}<section class="form-section"><span class="eyebrow">خطوة أخيرة</span><h1>بيانات التوصيل</h1><form method="post" class="checkout-form">{% csrf_token %}<label>الاسم بالكامل<input name="customer_name" required maxlength="150"></label><label>رقم الهاتف<input name="phone" required maxlength="30" inputmode="tel"></label><label>العنوان بالتفصيل<textarea name="address" required></textarea></label><label>ملاحظات إضافية<textarea name="notes"></textarea></label><button class="btn">تأكيد الطلب</button></form></section>{% endblock %}
